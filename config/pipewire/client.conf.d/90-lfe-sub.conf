# Stereo -> 2.1: posílat basy do LFE (Velodyne SPL II, LFE vstup).
# Mythos Four: -3 dB @ ~104 Hz (Sound & Vision HT Labs) -> cílové dělení ~100 Hz.
# Pozor: hodnota v PipeWire neodpovídá reálnému dělení. Změřeno (PipeWire 1.6):
#   lfe-cutoff 100 -> LFE -6 dB @ 50 Hz;  lfe-cutoff 200 -> LFE -6 dB @ ~100 Hz
stream.properties = {
    channelmix.upmix      = true
    channelmix.lfe-cutoff = 200
}
