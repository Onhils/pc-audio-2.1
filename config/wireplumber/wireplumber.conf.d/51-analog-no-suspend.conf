# Nenechat analogový 2.1 výstup uspávat. Když PipeWire výstup zavře, uspí se kodek
# (snd_hda_intel power_save = 10 s, nastavuje tuned) a citlivá Penta pak v tichu
# zesiluje rušení z nezatíženého výstupu. Ověřeno 2026-11-27: digitální ticho rušení odstraní.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*analog-surround-21" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
