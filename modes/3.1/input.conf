# pc-audio (3.1): přepínání, odkud jdou dialogy – jen pro filmy s 5.1 zvukem.
# F1 = centr, F2 = sloupy (jako 2.1), F3 = mix. Okamžité A/B ve stejné scéně, nic se neukládá
# (další film začne zase s centrem). F-klávesy mpv jinak nepoužívá (C/V/B ano – titulky, debanding).
F1 set af "lavfi=[pan=3.1|c0=0.5*c0+0.354*c4|c1=0.5*c1+0.354*c5|c2=0.5*c2|c3=0.7*c3,alimiter=limit=0.7:level=false]"; show-text "Dialogy: CENTR"
F2 set af "lavfi=[pan=3.1|c0=0.5*c0+0.354*c2+0.354*c4|c1=0.5*c1+0.354*c2+0.354*c5|c2=0*c2|c3=0.7*c3,alimiter=limit=0.7:level=false]"; show-text "Dialogy: SLOUPY (jako 2.1)"
F3 set af "lavfi=[pan=3.1|c0=0.5*c0+0.15*c2+0.354*c4|c1=0.5*c1+0.15*c2+0.354*c5|c2=0.42*c2|c3=0.7*c3,alimiter=limit=0.7:level=false]"; show-text "Dialogy: MIX (centr + trochu do sloupů)"
