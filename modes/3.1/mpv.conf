# Výstup: 3.1 (Mythos Four + Mythos Three centr + Velodyne). Bass management dělá
# filtr "3.1 EQ (místnost)" v PipeWire (viz 91-room-eq.conf), mpv jen poskládá kanály:
#   FL/FR = 0.5*přední + surroundy -3 dB vůči nim (0.354), FC = 0.5*centr, LFE = 0.7*LFE stopa (+3 dB).
# alimiter: strop 0.7 (-3.1 dBFS) – ekvalizér za limiterem zvedá špičky až o ~1.6 dB
# (měřeno na Rivalech 2026-11-27 ve 2.1). level=false = žádné auto-zesílení.

# Hlasitost mpv max 100 %: zesílení nad 100 by šlo až za limiter a mohlo by ořezávat.
volume-max=100

# Ovládání z telefonu (GSConnect „Spustit příkaz“ -> mpv-ovladac) přes tento socket.
input-ipc-server=~~/socket

[downmix-5.1]
profile-cond=p["audio-params/channel-count"] == 6
profile-restore=copy-equal
audio-channels=fl-fr-fc-lfe
af=lavfi=[pan=3.1|c0=0.5*c0+0.354*c4|c1=0.5*c1+0.354*c5|c2=0.5*c2|c3=0.7*c3,alimiter=limit=0.7:level=false]

[downmix-7.1]
profile-cond=p["audio-params/channel-count"] == 8
profile-restore=copy-equal
audio-channels=fl-fr-fc-lfe
af=lavfi=[pan=3.1|c0=0.5*c0+0.25*c4+0.25*c6|c1=0.5*c1+0.25*c5+0.25*c7|c2=0.5*c2|c3=0.7*c3,alimiter=limit=0.7:level=false]
