# Výstup: 2.1 (Mythos Four + Velodyne). PipeWire dělá bass management jen ze sterea
# (lfe-cutoff, viz ~/.config/pipewire/*/90-lfe-sub.conf), proto se 5.1/7.1 nejdřív
# smíchá do sterea včetně LFE stopy a basy do subu pak odfiltruje PipeWire (~100 Hz).
# Koeficienty: hlavní kanály 0.5, centr a surroundy -3 dB (0.354), LFE stopa 0.7 (+3 dB).
# alimiter zabrání ořezávání při hlasitých scénách (level=false = žádné auto-zesílení).
# Strop 0.7 (-3.1 dBFS): ekvalizér místnosti za limiterem zvedá špičky až o ~1.6 dB
# (Rivalové 2026-11-27: s 0.9 špička 0.0 dBFS + 2 ořezané vzorky; s 0.8 špička -0.3 dBFS).

# Hlasitost mpv max 100 %: zesílení nad 100 by šlo až za limiter a mohlo by ořezávat.
# Hlasitost filmů se ovládá v PC (systémová hlasitost mění sloupy i sub stejně).
volume-max=100

# Ovládání z telefonu (GSConnect „Spustit příkaz“ -> mpv-ovladac) přes tento socket.
input-ipc-server=~~/socket

[downmix-5.1]
profile-cond=p["audio-params/channel-count"] == 6
profile-restore=copy-equal
af=lavfi=[pan=stereo|c0=0.5*c0+0.354*c2+0.7*c3+0.354*c4|c1=0.5*c1+0.354*c2+0.7*c3+0.354*c5,alimiter=limit=0.7:level=false]

[downmix-7.1]
profile-cond=p["audio-params/channel-count"] == 8
profile-restore=copy-equal
af=lavfi=[pan=stereo|c0=0.5*c0+0.354*c2+0.7*c3+0.25*c4+0.25*c6|c1=0.5*c1+0.354*c2+0.7*c3+0.25*c5+0.25*c7,alimiter=limit=0.7:level=false]
