# Výstup: 5.1 (Mythos Four + Mythos Three centr + Velodyne + 2× Mythos Five zadní).
# Bass management, zpoždění zadních a jejich zap/vyp dělá filtr "5.1 EQ (místnost)".
# mpv jen předá kanály (všechny 0.5, LFE stopa 0.7 = +3 dB) + alimiter 0.7 (rezerva pro EQ).

# Hlasitost mpv max 100 %: zesílení nad 100 by šlo až za limiter a mohlo by ořezávat.
volume-max=100

# Ovládání z telefonu (GSConnect „Spustit příkaz“ -> mpv-ovladac) přes tento socket.
input-ipc-server=~~/socket

[surround-5.1]
profile-cond=p["audio-params/channel-count"] == 6
profile-restore=copy-equal
audio-channels=5.1
af=lavfi=[pan=5.1|c0=0.5*c0|c1=0.5*c1|c2=0.5*c2|c3=0.7*c3|c4=0.5*c4|c5=0.5*c5,alimiter=limit=0.7:level=false]

[surround-7.1]
profile-cond=p["audio-params/channel-count"] == 8
profile-restore=copy-equal
audio-channels=5.1
af=lavfi=[pan=5.1|c0=0.5*c0|c1=0.5*c1|c2=0.5*c2|c3=0.7*c3|c4=0.354*c4+0.354*c6|c5=0.354*c5+0.354*c7,alimiter=limit=0.7:level=false]
