# pc-audio (5.1): odkud jdou dialogy (centrální kanál) – jen pro filmy s 5.1 zvukem.
# F1 = centr, F2 = sloupy, F3 = mix. Zadní zap/vyp: mpv-ovladac zadni-zap / zadni-vyp (telefon).
F1 set af "lavfi=[pan=5.1|c0=0.5*c0|c1=0.5*c1|c2=0.5*c2|c3=0.7*c3|c4=0.5*c4|c5=0.5*c5,alimiter=limit=0.7:level=false]"; show-text "Dialogy: CENTR"
F2 set af "lavfi=[pan=5.1|c0=0.5*c0+0.354*c2|c1=0.5*c1+0.354*c2|c2=0*c2|c3=0.7*c3|c4=0.5*c4|c5=0.5*c5,alimiter=limit=0.7:level=false]"; show-text "Dialogy: SLOUPY"
F3 set af "lavfi=[pan=5.1|c0=0.5*c0+0.15*c2|c1=0.5*c1+0.15*c2|c2=0.42*c2|c3=0.7*c3|c4=0.5*c4|c5=0.5*c5,alimiter=limit=0.7:level=false]"; show-text "Dialogy: MIX (centr + trochu do sloupů)"
